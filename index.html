<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070d;
  --bg-glass:rgba(6,7,13,.74);
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.19);
  --tx:#eef1f8;
  --mut:#96a0b5;
  --accent:#7c9cff;
  --accent-2:#36e2c2;
  --red:#ff3b5c;
  --amber:#ffb020;
  --green:#3ddc97;
  --card-bg:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.022));
  --col-bg:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
  --dialog-bg:linear-gradient(180deg,#151b2d,#0c101d);
  --toast-bg:#161c2e;
  --shadow:0 26px 70px -30px rgba(0,0,0,.85);
  --shadow-sm:0 12px 30px -16px rgba(0,0,0,.7);
  --topbar-h:64px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef1f8;
  --bg-glass:rgba(244,246,252,.8);
  --panel:rgba(255,255,255,.72);
  --panel-2:#ffffff;
  --line:rgba(15,23,42,.09);
  --line-strong:rgba(15,23,42,.2);
  --tx:#101728;
  --mut:#5d677c;
  --card-bg:linear-gradient(180deg,#ffffff,#f7f9ff);
  --col-bg:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  --dialog-bg:linear-gradient(180deg,#ffffff,#f4f7ff);
  --toast-bg:#ffffff;
  --shadow:0 26px 70px -34px rgba(23,37,84,.4);
  --shadow-sm:0 12px 30px -18px rgba(23,37,84,.35);
  --dark:#101728;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:Manrope,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;
  overflow-x:hidden;padding-bottom:56px;
  -webkit-font-smoothing:antialiased;
  transition:background .35s,color .35s;
}
[hidden]{display:none!important}
.bg-glow{
  position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(45% 35% at 18% 8%,rgba(99,102,241,.2),transparent 60%),
    radial-gradient(40% 32% at 85% 4%,rgba(54,226,194,.14),transparent 60%),
    radial-gradient(46% 38% at 50% 108%,rgba(124,156,255,.12),transparent 60%);
  animation:drift 26s ease-in-out infinite alternate;
}
[data-theme="light"] .bg-glow{
  background:
    radial-gradient(45% 35% at 18% 8%,rgba(99,102,241,.16),transparent 60%),
    radial-gradient(40% 32% at 85% 4%,rgba(54,226,194,.12),transparent 60%),
    radial-gradient(46% 38% at 50% 108%,rgba(124,156,255,.1),transparent 60%);
}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s}
button:hover{background:var(--panel-2);border-color:var(--line-strong)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .2s,background .2s}
input:hover,select:hover{border-color:var(--line-strong)}
input:focus,select:focus{border-color:var(--accent)}
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:12px clamp(14px,3vw,32px);
  background:var(--bg-glass);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--line);
  animation:fadeUp .5s both;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;user-select:none}
.brand-mark{
  display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;
  font-weight:800;font-size:18px;letter-spacing:-.02em;
  box-shadow:0 12px 26px -12px rgba(99,102,241,.95),inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:15px;letter-spacing:.01em}
.brand-text small{font-size:10.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-inline:auto}
.tabs button{border:0;background:transparent;color:var(--mut);padding:9px 20px;border-radius:10px;font-weight:600;font-size:14px}
.tabs button:hover{background:var(--panel-2);color:var(--tx);transform:none}
.tabs button.on{color:#fff;background:linear-gradient(135deg,#5b6cff,#8b5cf6);box-shadow:0 10px 24px -12px #5b6cff}
.tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);transition:background .2s,box-shadow .2s}
.sync.busy i{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blinkDot 1s infinite}
.sync.off i{background:var(--red);box-shadow:0 0 10px var(--red)}
.icon-btn{display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:12px;color:var(--tx)}
.weekbar{
  display:flex;align-items:center;justify-content:center;gap:10px;
  max-width:1320px;margin:22px auto 0;padding:0 clamp(14px,3vw,32px);
  animation:fadeUp .55s both .05s;
}
.weekbar .nav{width:44px;height:44px;flex-shrink:0}
.weekbar .nav svg{width:20px;height:20px}
.weekinfo{flex:1;min-width:0;text-align:center}
.range{font-size:clamp(17px,2.4vw,22px);font-weight:800;letter-spacing:-.015em}
.weekmeta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--panel);
  font-weight:700;color:var(--tx);font-size:11px;letter-spacing:.05em;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#22d3ee)}
.ghost-btn{background:transparent}
.pills{display:none}
.hint{max-width:1320px;margin:12px auto 0;padding:0 24px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.55}
.lg{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 5px 0 12px;vertical-align:middle;background:currentColor}
.lg.y{color:var(--amber)}.lg.r{color:var(--red)}.lg.e{color:#ff6b81}
.grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;
  max-width:1320px;margin:16px auto 0;padding:0 clamp(14px,2.4vw,22px);align-items:start;
}
.col{
  background:var(--col-bg);border:1px solid var(--line);border-radius:20px;
  padding:10px 10px 2px;position:relative;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.col h3{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:2px 2px 12px;padding:4px 4px 10px;border-bottom:1px solid var(--line);
  font-size:14px;font-weight:700;letter-spacing:.01em;
}
.col h3 small{color:var(--mut);font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums}
.col.today{
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent),0 30px 70px -40px color-mix(in srgb,var(--accent) 80%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent 55%),var(--col-bg);
}
.col.today h3{color:var(--accent)}
.col.today h3 .d::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;box-shadow:0 0 10px var(--accent);animation:pulseDot 2s ease-in-out infinite}
.col.alarm h3{color:var(--red);animation:alarmPulse 1.4s ease-in-out infinite}
.cell{position:relative;margin-bottom:10px;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*16ms);cursor:default}
body.edit .cell{cursor:pointer}
.card{
  position:relative;display:flex;flex-direction:column;min-height:132px;border-radius:16px;
  border:1px solid var(--line);overflow:hidden;
  background:
    radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 62%),
    var(--card-bg);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 40%,var(--line));box-shadow:var(--shadow-sm)}
.card::before{
  content:"";position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 25%,transparent));
}
.card-main{flex:1;padding:14px 10px 6px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.subj{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.25;letter-spacing:-.005em;word-break:break-word}
.room{
  display:inline-flex;align-items:center;flex-shrink:0;padding:2px 7px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.03em;
  background:color-mix(in srgb,var(--c) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);
  color:var(--tx);white-space:nowrap;
}
.tch{margin-top:6px;font-size:11.5px;color:var(--mut);line-height:1.3}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 10px;min-height:20px}
.time{font-size:10.5px;color:var(--mut);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time.live{color:var(--red);font-weight:800;display:inline-flex;align-items:center;gap:5px}
.time.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);animation:ping 1.4s ease-out infinite}
.tag{
  position:relative;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,#ffd15c,#ff9d1f);color:#2a1600;
  font-weight:800;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;box-shadow:0 6px 16px -8px rgba(255,176,32,.95);
}
.tag::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
  transform:translateX(-130%);animation:shine 3.4s ease-in-out infinite;
}
.bar{height:4px;background:rgba(127,140,180,.14);overflow:hidden}
[data-theme="light"] .bar{background:rgba(15,23,42,.08)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 45%,white));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.live i{background-image:repeating-linear-gradient(90deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 55%,white) 8px 16px);background-size:16px 100%;animation:stripes .9s linear infinite}
.bar.end i{background:color-mix(in srgb,var(--mut) 42%,transparent)}
.cell.changed .card{box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 32%,transparent),0 18px 44px -30px rgba(255,176,32,.7)}
.dots{
  display:none;position:absolute;top:-7px;right:-7px;z-index:4;
  width:24px;height:24px;padding:0;border-radius:8px;
  font-size:11px;line-height:1;letter-spacing:.5px;
  background:color-mix(in srgb,var(--bg) 62%,transparent);
  border:1px solid var(--line-strong);color:var(--tx);
  backdrop-filter:blur(4px);opacity:.8;
}
body.edit .dots{display:grid;place-items:center}
.dots:hover{opacity:1;background:var(--panel-2);transform:scale(1.08)}
body.edit .cell.empty:hover .dots{background:var(--panel-2)}
.cell.empty{min-height:132px}
.ghost{
  height:100%;min-height:132px;border-radius:16px;border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--mut);font-size:11.5px;letter-spacing:.04em;
  background:linear-gradient(180deg,rgba(255,255,255,.012),transparent);transition:.2s;
}
body.edit .cell.empty:hover .ghost{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.xcard{
  position:relative;min-height:132px;border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:16px 12px;
  background:linear-gradient(135deg,rgba(255,59,92,.96),rgba(176,16,56,.98));
  border:1px solid rgba(255,120,140,.45);
  box-shadow:0 18px 44px -24px rgba(255,59,92,.9);
  animation:cancelIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.xcard::before{
  content:"";position:absolute;inset:-60%;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 12px,transparent 12px 24px);
  animation:stripeMove 14s linear infinite;
}
.xcard b{position:relative;font-size:14px;font-weight:800;letter-spacing:.18em}
.xcard small{position:relative;font-size:11px;opacity:.92;max-width:100%;padding:0 4px}
.cell.chem{margin-bottom:34px}
.beacon{
  position:absolute;left:50%;top:50%;width:var(--bs,150px);height:var(--bs,150px);
  margin:calc(var(--bs,150px)/-2) 0 0 calc(var(--bs,150px)/-2);
  border-radius:50%;pointer-events:none;z-index:0;opacity:.6;
  background:conic-gradient(from 0deg,rgba(255,59,92,.9),transparent 20%,rgba(255,59,92,.9) 40%,transparent 60%,rgba(255,59,92,.9) 80%,transparent);
  filter:blur(16px);animation:spin 2.6s linear infinite;
}
.cell.chem .card{border-color:color-mix(in srgb,var(--red) 45%,var(--line));box-shadow:0 0 36px -10px color-mix(in srgb,var(--red) 70%,transparent)}
.edittools{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  max-width:1320px;margin:14px auto 0;padding:0 clamp(14px,3vw,32px);
  animation:fadeIn .25s both;
}
.chgcount{font-size:12.5px;color:var(--mut);margin-right:4px}
.edittools button{padding:8px 14px;font-size:13px;border-radius:11px}
.danger{color:#ffd7de;background:color-mix(in srgb,var(--red) 18%,transparent);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.danger:hover{background:color-mix(in srgb,var(--red) 28%,transparent);border-color:color-mix(in srgb,var(--red) 60%,transparent)}
[data-theme="light"] .danger{color:#b3123a}
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;border-radius:14px;font-size:13px;
  background:var(--toast-bg);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  animation:toastIn .28s cubic-bezier(.2,.8,.2,1) both;
}
.toast span{flex:1}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:4px 8px;font-size:12px;border-radius:8px}
.toast button:hover{background:var(--panel)}
.toast.out{animation:toastOut .25s ease forwards}
.ov{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;
  background:rgba(3,5,10,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fadeIn .18s both;
}
body.modal-open{overflow:hidden}
.dlg{
  width:min(430px,100%);max-height:min(88vh,720px);overflow:auto;
  padding:20px;border-radius:22px;
  background:var(--dialog-bg);border:1px solid var(--line-strong);
  box-shadow:0 40px 100px -30px rgba(0,0,0,.85);
  animation:pop .28s cubic-bezier(.2,.9,.3,1.15) both;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;
}
.dlg-head{text-align:center;margin-bottom:2px}
.dlg h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.dlg-sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.menu{display:grid;gap:8px;margin-top:4px}
.menu .m{width:100%;text-align:left;padding:12px 14px;border-radius:13px;font-weight:600;font-size:14px;background:var(--panel);border:1px solid var(--line);transition:.2s}
.menu .m:hover{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:color-mix(in srgb,var(--accent) 40%,var(--line));transform:translateX(2px)}
.menu .m.danger{color:#ff8fa3;background:color-mix(in srgb,var(--red) 10%,var(--panel));border-color:color-mix(in srgb,var(--red) 32%,var(--line))}
.menu .m.danger:hover{background:color-mix(in srgb,var(--red) 20%,var(--panel))}
[data-theme="light"] .menu .m.danger{color:#b3123a}
.dlg label{display:grid;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.dlg label input,.dlg label select{font-weight:500}
.dlg .chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx);font-weight:600;cursor:pointer}
.dlg .chk input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.dlg .row{display:flex;gap:8px;margin-top:6px}
.dlg .row button{flex:1;padding:12px;border-radius:13px;font-weight:700}
.dlg button.ok{background:linear-gradient(135deg,#5b6cff,#8b5cf6);border:0;color:#fff;box-shadow:0 14px 30px -14px #5b6cff}
.dlg button.ok:hover{filter:brightness(1.08);transform:translateY(-1px)}
.dlg .hint{margin:0;padding:0;text-align:left;font-size:12px;line-height:1.5}
@media(max-width:1100px){
  .brand-text small{display:none}
  .sync span{display:none}
  .weekbar .ghost-btn{padding:9px 12px;font-size:13px}
}
@media(max-width:1180px) and (min-width:861px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1000px;gap:12px}
}
@media(max-width:860px){
  .grid{grid-template-columns:1fr;max-width:640px;gap:10px}
  .col:not(.show){display:none}
  .col{padding:10px 12px 2px}
  .cell{--bs:min(320px,90vw)}
  .pills{
    display:flex;gap:6px;position:sticky;top:var(--topbar-h,64px);z-index:50;
    margin:12px 0 0;padding:10px clamp(14px,3vw,32px);
    background:var(--bg-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .pills button{flex:1;padding:9px 0;font-size:13px;font-weight:600;border-radius:11px}
  .pills button.on{background:linear-gradient(135deg,#5b6cff,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 10px 22px -14px #5b6cff}
  .pills button.alarm{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}

  edit=x;
  $("t1").className=x?"":"on";$("t2").className=x?"on":"";
  $("t1").setAttribute("aria-pressed",String(!x));$("t2").setAttribute("aria-pressed",String(!!x));
  document.body.classList.toggle("edit",x);
  $("etools").hidden=!x;
  $("hint").innerHTML=x
    ?'Нажмите на любую пару, чтобы изменить её. Стрелки ← → листают недели, <b>Ctrl+Z</b> отменяет последнее изменение. Изменения видны всем посетителям.'
    :'<span class="lg y"></span>Замена · <span class="lg r"></span>Отмена пары · <span class="lg e"></span>Экстренная замена';
  render();updateEditInfo();
}
$("t1").onclick=function(){tab(false)};
$("t2").onclick=function(){tab(true)};
$("grid").onclick=function(ev){
  if(!edit)return;
  var cell=ev.target.closest(".cell");if(!cell)return;
  openMenu(cell.dataset.k,+cell.dataset.di);
};
function show(h){$("dl").innerHTML=h;$("md").hidden=false;document.body.classList.add("modal-open")}
function close(){$("md").hidden=true;document.body.classList.remove("modal-open")}
$("md").onclick=function(ev){if(ev.target===$("md"))close()};
function btn(a,t,c){return'<button class="m'+(c||"")+'" data-a="'+a+'">'+t+'</button>'}
function openMenu(k,di){
  CK=k;CD=di;
  var si=+k.split("|")[1];
  var r=lesson(new Date(k.split("|")[0]+"T00:00"),di,si);
  CL=r.l;
  var h='<div class="dlg-head"><h4>'+D[di]+'</h4><div class="dlg-sub">'+T[si]+(CL?' · '+esc(CL.n):" · свободно")+'</div></div><div class="menu">';
  h+=btn("zam",CL?"Замена пары":"Добавить пару");
  if(CL)h+=btn("aud","Сменить аудиторию")+btn("prep","Сменить преподавателя");
  h+=btn("vpr","Отметить ВПР");
  if(CL)h+=btn("cancel","Отменить пару"," danger");
  if(st.ch[k])h+=btn("undo","Вернуть исходную пару"," ghost");
  h+='</div><div class="row"><button data-a="x">Закрыть</button></div>';
  show(h);
}
function pk(id,lab,list,val,opt){var cu=val&&list.indexOf(val)<0;
  return'<label>'+lab+'<select id="'+id+'">'+(opt?'<option value="">— нет —</option>':"")+list.map(function(x){return'<option'+(x==val?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'<option value="__"'+(cu?" selected":"")+'>Другое…</option></select><input id="'+id+'_t" placeholder="Впишите вручную" value="'+(cu?esc(val):"")+'"'+(cu?"":" hidden")+'></label>'}
function gv(id){var s=$(id);if(!s)return"";return s.value=="__"?$(id+"_t").value.trim():s.value}
function sv(id,v){var s=$(id);if(!s)return;var ok=[].some.call(s.options,function(o){return o.value==v||o.text==v});if(ok){s.value=v;var t=$(id+"_t");if(t)t.hidden=true}}
function fillSubj(){var n=gv("fs"),c=CAT.filter(function(x){return x[0]==n})[0];if(!c)return;var rs=isR(c[1])?c[1].split("/"):[c[1]],t=c[2].split(", ");sv("fr1",rs[0]);sv("fr2",rs[1]||"");sv("ft1",t[0]);sv("ft2",t[1]||"");var u=$("fu");if(u)u.checked=/^хим/i.test(n)}
function form(a){
  CA=a;var l=CL||{},rr=isR(l.r)?l.r.split("/"):[l.r||""],tt=(l.p||"").split(", "),si=+CK.split("|")[1];
  var h='<div class="dlg-head"><h4>'+(a=="zam"&&!CL?"Добавить пару":TITLE[a])+'</h4><div class="dlg-sub">'+D[CD]+' · '+T[si]+'</div></div>';
  if(a=="zam"||a=="vpr")h+=pk("fs","Предмет",SUBJ,l.n||SUBJ[0]);
  if(a!="prep")h+=pk("fr1","Аудитория",ROOMS,rr[0])+(a=="vpr"?"":pk("fr2","Вторая аудитория (если есть)",ROOMS,rr[1]||"",1));
  if(a=="zam"||a=="prep")h+=pk("ft1","Преподаватель",TEACH,tt[0])+pk("ft2","Второй преподаватель (если есть)",TEACH,tt[1]||"",1);
  if(a=="zam")h+='<label class="chk"><input type="checkbox" id="fu"'+(urg(l)?" checked":"")+'>Экстренная замена (красная тревога)</label>';
  if(a=="vpr")h+='<p class="hint">Все пары после ВПР в этот день отменяются автоматически. Преподаватель не указывается.</p>';
  h+='<div class="row"><button class="ok" data-a="save">Сохранить</button><button data-a="x">Закрыть</button></div>';
  show(h);
  if(!CL&&(a=="zam"||a=="vpr"))fillSubj();
}
function j(a,b,s){return[a,b].filter(Boolean).join(s)}
function commit(k,val,msg){
  remember(k);
  if(val===null)delete st.ch[k];else st.ch[k]=val;
  push(k,val);save();close();render();updateEditInfo();
  toast(msg||"Изменение сохранено","Отменить",undoLast);
}
function saveF(){
  var l=CL||{},o;
  if(CA=="zam"){var n=gv("fs");if(!n){toast("Выберите предмет");return}
    o={t:"zam",n:n,r:j(gv("fr1"),gv("fr2"),"/"),p:j(gv("ft1"),gv("ft2"),", "),u:!!($("fu")&&$("fu").checked)}}
  else if(CA=="aud"){if(!gv("fr1")){toast("Укажите аудиторию");return}
    o=Object.assign({},l,{t:"aud",r:j(gv("fr1"),gv("fr2"),"/")})}
  else if(CA=="prep"){if(!gv("ft1")){toast("Укажите преподавателя");return}
    o=Object.assign({},l,{t:"prep",p:j(gv("ft1"),gv("ft2"),", ")})}
  else{if(!gv("fs")){toast("Выберите предмет");return}
    o={t:"vpr",n:gv("fs"),r:gv("fr1"),p:"",u:false}}
  commit(CK,o,CA=="zam"&&!CL?"Пара добавлена":(MSG[CA]||"Изменение сохранено"));
}
function askReset(){
  var keys=weekKeys(),n=0;keys.forEach(function(k){if(st.ch[k])n++});
  if(!n){toast("На этой неделе нет изменений");return}
  show('<div class="dlg-head"><h4>Сбросить неделю?</h4><div class="dlg-sub">Вернуть исходное расписание</div></div>'+
       '<p class="hint">Будут удалены все изменения на выбранной неделе: '+n+' '+plural(n,"пара","пары","пар")+'. Остальные недели не затронуты.</p>'+
       '<div class="row"><button class="danger" data-a="reset-yes">Сбросить</button><button data-a="x">Отмена</button></div>');
}
function doReset(){
  var keys=weekKeys(),n=0;
  keys.forEach(function(k){
    if(st.ch[k]){undoStack.push({k:k,had:true,val:clone(st.ch[k])});if(undoStack.length>40)undoStack.shift();delete st.ch[k];push(k,null);n++}
  });
  if(n){save();close();render();updateEditInfo();toast("Сброшено изменений: "+n)}
  else close();
}
$("dl").onclick=function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
  if(a=="x")close();
  else if(a=="save")saveF();
  else if(a=="cancel")commit(CK,{cancel:true},"Пара отменена");
  else if(a=="undo")commit(CK,null,"Изменение удалено");
  else if(a=="reset-yes")doReset();
  else form(a);
};
$("dl").onchange=function(ev){
  var s=ev.target,t=$(s.id+"_t");
  if(t)t.hidden=s.value!="__";
  if(s.id=="fs")fillSubj();
};
$("undoBtn").onclick=undoLast;
$("resetBtn").onclick=askReset;
$("theme").onclick=function(){setTheme(document.documentElement.dataset.theme==="light"?"dark":"light")};
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("md").hidden){close();return}
  if(!$("md").hidden)return;
  var t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"))return;
  if(e.key==="ArrowLeft"){go(-1)}
  else if(e.key==="ArrowRight"){go(1)}
  else if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();undoLast()}
});
window.addEventListener("online",function(){syncUI();toast("Соединение восстановлено");pull()});
window.addEventListener("offline",function(){syncUI();toast("Нет соединения — изменения сохранятся локально")});
window.addEventListener("resize",setTopbarH);
tab(false);
setTheme(document.documentElement.dataset.theme||"dark");
setTopbarH();
if(!navigator.onLine){syncEl.className="sync off";syncTxt.textContent="Офлайн"}
pull();setInterval(pull,15000);setInterval(bars,10000);
setTimeout(setTopbarH,400);

</script>
</body>
</html>
