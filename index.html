<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<style>
:root{--bg:#080a12;--panel:#12151f;--card:#33353a;--line:#1f2a44;--tx:#f2f4f8;--mut:#9aa0ae;--red:#ff2a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#080a12}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;padding:0 10px 30px}
.tabs,.nav,.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 16px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5b8cff}
.tabs button{font-size:18px;min-width:130px}.tabs button.on,.pills button.on{background:#1d2740;border-color:#4a69b8}
.nav{align-items:center}.nav b{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px}
.nav button{min-width:70px;font-size:20px}
.wk{text-align:center;margin-bottom:8px}.wk span{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:1200px;margin:0 auto}
.col{border-left:2px solid var(--line);border-right:2px solid var(--line);padding:0 3px}
.col h3{text-align:center;margin:8px 0 12px;font-size:19px}
.col h3 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.col.today h3{color:#7fb0ff}
.col.alarm h3{animation:blink .9s steps(2,jump-none) infinite;color:var(--red)}
@keyframes blink{50%{color:#fff;text-shadow:0 0 14px var(--red)}}
.cell{position:relative;height:118px;margin-bottom:10px}
.card{position:relative;z-index:1;background:#16181d;border-radius:6px;border-top:3px solid var(--c);height:100%;padding:0 0 6px;display:flex;flex-direction:column;overflow:hidden}
.in{background:var(--card);margin:3px 3px 0;border-radius:4px;padding:6px 8px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.top{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.top span:last-child{white-space:nowrap;font-size:12px}
.room{background:var(--c);color:#fff;border-radius:4px;padding:0 5px;font-size:12px}
.tch{color:var(--mut);font-size:12px;line-height:1.3}
.time{text-align:center;font-size:11px;padding-top:3px}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px}.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:0 3px 3px 0;transition:width .6s}.bar.end i{width:100%;background:#7a7a7a;border-radius:0}
.time.live{color:#ff6b6b;font-weight:700}.time.live::before{content:"● ";animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.2}}
.tag{position:absolute;right:6px;bottom:20px;font-size:10px;background:#ffb020;color:#111;border-radius:4px;padding:1px 6px;font-weight:700}
.cell.cancel .in{opacity:.45}.cell.cancel .top span:first-child{text-decoration:line-through}
.cell.cancel .tag{background:#ff4d4d;color:#fff}
.cell.chem{margin-bottom:48px}
.beacon{position:absolute;left:50%;top:100%;width:var(--bs,150px);height:var(--bs,150px);margin:calc(var(--bs,150px)/-2) 0 0 calc(var(--bs,150px)/-2);pointer-events:none;z-index:0;border-radius:50%;
background:conic-gradient(var(--red) 0 60deg,transparent 60deg 180deg,var(--red) 180deg 240deg,transparent 240deg);
filter:blur(9px);animation:spin 1.3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pills{display:none}
.hint{text-align:center;color:var(--mut);font-size:13px;max-width:1200px;margin:6px auto}
form{max-width:480px;margin:10px auto;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
form input,form select{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.ok{background:#1d3a2a;border-color:#2f7a4f}.bad{background:#3a1d1d;border-color:#8a3a3a}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}.chk input{width:auto}
#msg{text-align:center;color:#6fd69a;min-height:20px}
@media (max-width:760px){
 .cell{--bs:min(340px,92vw)}
 .grid{grid-template-columns:1fr}.col:not(.show){display:none}.pills{display:flex;gap:6px}.pills button{padding:8px 11px}
 .pills button.alarm{color:var(--red);border-color:var(--red)}}
@media (prefers-reduced-motion:reduce){.beacon,.col.alarm h3{animation:none}}

.top .rm{white-space:nowrap;font-size:12px}
.dots{background:#555;border:0;border-radius:10px;padding:0 7px;font-size:12px;line-height:18px;color:#fff;cursor:pointer;letter-spacing:1px}
.cell>.dots{position:absolute;right:6px;top:6px;z-index:3}
.cell.empty>.dots{font-size:16px;padding:0 10px;opacity:.7}
.xcard{position:relative;z-index:1;height:100%;background:#c40000;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.xcard b{font-size:30px;font-weight:500}.xcard small{font-size:11px;opacity:.85;margin-top:4px;padding:0 8px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.ov[hidden]{display:none}
.dlg{background:#0d1020;border:2px solid var(--line);border-radius:18px;padding:14px;width:min(360px,100%);max-height:90vh;overflow:auto;display:grid;gap:8px}
.dlg h4{margin:0 0 4px;text-align:center;font-size:15px}
.dlg button.m{background:#5a5a5a;border:0;font-size:20px;padding:8px}.dlg button.m.sm{font-size:14px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.dlg select,.dlg input{width:100%}
.dlg .chk{display:flex;gap:8px;align-items:center;color:var(--tx)}.dlg .chk input{width:auto}
.dlg .row{display:flex;gap:8px}.dlg .row button{flex:1}
</style></head><body>
<div class="tabs"><button id="t1" class="on">Расписание</button><button id="t2">Редактирование</button></div>
<div id="v1">
 <div class="nav"><button id="prev" aria-label="Прошлая неделя">←</button><b id="range"></b><button id="next" aria-label="Следующая неделя">→</button></div>
 <div class="wk"><span id="par"></span></div>
 <div class="pills" id="pills"></div>
 <div class="grid" id="grid"></div>
 <p class="hint" id="hint"></p>
</div>
<div class="ov" id="md" hidden><div class="dlg" id="dl"></div></div>
<script>
var T=["08:30-10:00","10:10-11:40","12:00-13:30","14:00-15:30","15:50-17:20"],D=["Понедельник","Вторник","Среда","Четверг","Пятница"],DS=["Пн","Вт","Ср","Чт","Пт"];
var COL={"Физика":"#1e78d6","Информатика":"#8a5cf0","ОБЗР":"#f0c93a","Биология":"#3fae4a","Обществознание":"#2bb3a0","Иностранный язык":"#4aa3f0","Литература":"#f29a1f","Математика":"#1e78d6","История":"#8a6552","Физкультура":"#1e78d6","Русский язык":"#1e78d6","Химия":"#e11"};
var CAT=[["Русский язык","227","А.К. Абдулаева"],["Литература","227","А.К. Абдулаева"],["Иностранный язык","227/225","Е.Н. Головакина, Е.Н. Трунилова"],["Иностранный язык","405/225","Е.Н. Головакина, Е.Н. Трунилова"],["Математика","605","К.Н. Виноградова"],["Математика","619","К.Н. Виноградова"],["Информатика","309","Е.В. Смирнова"],["Физика","204","В.В. Синцов"],["Биология","620","Е.Л. Романовская"],["Химия","804","Е.А. Вагина"],["История","223","Н.Н. Букина"],["Обществознание","223","Н.Н. Букина"],["Физкультура","Т/З","Ю.Н. Сивкова, А.И. Темеров"],["Физкультура","С/З","Ю.Н. Сивкова, А.И. Темеров"],["Математика","808","К.Н. Виноградова"],["ОБЗР","118","Н.В. Колигаев"]];
function uniq(a){return a.filter(function(x,i){return x&&a.indexOf(x)==i})}

var BASE0=[[
[null,L("Физика 1 гр.","204",sy),L("ОБЗР","118",ko),L("Обществознание","223",bu),L("Физика 2 гр.","204",sy)],
[null,L("Информатика 1 гр.","309",sm),L("Биология","620",ro),L("Иностранный язык","227/225",ie),L("Информатика 2 гр.","309",sm)],
[L("Литература","227",ab),L("Математика","619",vi),L("Математика","619",vi),L("История","223",bu),null],
[L("Математика","605",vi),L("Химия","804",va),L("Физика","204",sy),L("Физкультура","С/З",fz),null],
[L("Русский язык","227",ab),L("Математика","605",vi),L("История","223",bu),L("Литература","227",ab),null]],[
[null,null,L("Физика","204",sy),L("История","223",bu),L("ОБЗР","118",ko)],
[null,L("Информатика","309",sm),L("Биология","620",ro),L("Иностранный язык","405/225",ie),null],
[L("Информатика 1 гр.","309",sm),L("ОБЗР","118",ko),L("Математика","808",vi),L("Физика","204",sy),L("Информатика 2 гр.","309",sm)],
[L("Химия лаб.","804",va+", "+ro),L("Физкультура","С/З",fz),L("Русский язык","227",ab),L("Литература","227",ab),null],
[L("Обществознание","223",bu),L("История","223",bu),L("Математика","605",vi),L("Математика","605",vi),null]]];
var st={base:BASE0,ch:{}};
try{var sv0=localStorage.getItem("sched2");if(sv0)st=JSON.parse(sv0)}catch(e){}
function save(){try{localStorage.setItem("sched2",JSON.stringify(st))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
var REF=new Date(2026,8,28),off=0,day=0,now=new Date(),edit=false,CK,CL,CA;
var wd=(now.getDay()+6)%7;day=wd>4?0:wd;
function color(n){for(var k in COL)if(n.indexOf(k)==0)return COL[k];return"#6b7280"}
function urg(l){return l.u===undefined?/^хим/i.test(l.n):!!l.u}
function par(dt){var w=Math.round((monday(dt)-REF)/604800000);return((w%2)+2)%2}
function lesson(dt,di,si){var k=iso(dt)+"|"+si,b=st.base[par(dt)][di][si];
 if(b)for(var j=0;j<si;j++){var o=st.ch[iso(dt)+"|"+j];if(o&&o.t=="vpr")return{l:b,cancel:true,ch:true,k:k}}
 var c=st.ch[k];if(!c)return{l:b,ch:false,k:k};
 if(c.cancel)return{l:b,cancel:true,ch:true,k:k};
 return{l:c,ch:true,k:k,t:c.t}}
function render(){
 var m=monday(now);m.setDate(m.getDate()+off*7);var e=new Date(m);e.setDate(e.getDate()+4);
 $("range").textContent=fmt(m).slice(0,6)+m.getFullYear()+"-"+fmt(e);
 var wk=Math.round((m-REF)/604800000);$("par").textContent=(((wk%2)+2)%2==0?"I":"II")+" неделя";
 var g="",p="",today=iso(now);
 for(var di=0;di<5;di++){var dt=new Date(m);dt.setDate(dt.getDate()+di);var h="",chem=false;
  for(var si=0;si<5;si++){var r=lesson(dt,di,si),l=r.l,dots=edit?'<button class="dots" data-k="'+r.k+'" data-di="'+di+'" aria-label="Изменить пару">'+(l?"•••":"+")+'</button>':"";
   if(!l){h+='<div class="cell empty">'+dots+'</div>';continue}
   if(r.cancel){h+='<div class="cell"><div class="xcard"><b>ОТМЕНА</b><small>'+esc(l.n)+' · '+T[si]+'</small></div>'+dots+'</div>';continue}
   var c=color(l.n),isC=urg(l);if(isC)chem=true;
   h+='<div class="cell'+(isC?" chem":"")+'" style="--c:'+c+'">'+(isC?'<div class="beacon"></div>':"")+
   '<div class="card"><div class="in"><div class="top"><span>'+esc(l.n)+'</span><span class="rm"><span class="room">АУД '+esc(l.r)+'</span> '+dots+'</span></div><div class="tch">'+esc(l.p)+'</div></div><div class="time">'+T[si]+'</div><div class="bar" data-d="'+iso(dt)+'" data-s="'+si+'"><i></i></div>'+(r.ch?'<span class="tag">'+(TAG[r.t]||"Замена")+'</span>':"")+'</div></div>'}
  g+='<div class="col'+(iso(dt)==today?" today":"")+(chem?" alarm":"")+(di==day?" show":"")+'"><h3>'+D[di]+'<small>'+fmt(dt).slice(0,5)+'</small></h3>'+h+'</div>';
  p+='<button data-d="'+di+'" class="'+(di==day?"on ":"")+(chem?"alarm":"")+'">'+DS[di]+'</button>'}
 $("grid").innerHTML=g;$("pills").innerHTML=p;bars()}
function bars(){var n=new Date(),td=iso(n),m=n.getHours()*60+n.getMinutes();document.querySelectorAll(".bar").forEach(function(b){var q=T[+b.dataset.s].split("-").map(function(x){var a=x.split(":");return+a[0]*60+ +a[1]}),w=0,e=false;
 if(b.dataset.d<td)e=true;else if(b.dataset.d==td){if(m>=q[1])e=true;else if(m>q[0])w=(m-q[0])/(q[1]-q[0])*100}
 b.className="bar"+(e?" end":"");var tm=b.previousSibling,lv=!e&&w>0;tm.className="time"+(lv?" live":"");tm.textContent=lv?"Идёт · осталось "+(q[1]-m)+" мин":T[+b.dataset.s];b.firstChild.style.width=e?"":w+"%"})}
setInterval(bars,10000);
$("prev").onclick=function(){off--;render()};$("next").onclick=function(){off++;render()};
$("pills").onclick=function(ev){var b=ev.target.closest("button");if(b){day=+b.dataset.d;render()}};
function tab(x){edit=x;$("t1").className=x?"":"on";$("t2").className=x?"on":"";$("hint").textContent=x?"Нажмите ••• на паре, чтобы изменить её. Пока изменения хранятся только в этом браузере.":"Жёлтая метка — замена, красная карточка — отмена пары.";render()}
$("t1").onclick=function(){tab(false)};$("t2").onclick=function(){tab(true)};
$("grid").onclick=function(ev){var b=ev.target.closest(".dots");if(b)openMenu(b.dataset.k,+b.dataset.di)};
function show(h){$("dl").innerHTML=h;$("md").hidden=false}
function close(){$("md").hidden=true}
$("md").onclick=function(ev){if(ev.target==$("md"))close()};
function btn(a,t,c){return'<button class="m'+(c||"")+'" data-a="'+a+'">'+t+'</button>'}

 show('<h4>'+D[di]+', '+T[si]+(CL?' · '+esc(CL.n):'')+'</h4>'+btn("zam","Замена")+(CL?btn("aud","Замена АУД")+btn("prep","Замена Препод"):"")+btn("vpr","ВПР")+(CL?btn("cancel","Отмена"):"")+(st.ch[k]?btn("undo","Вернуть, если было изменение"," sm"):""))}
function pk(id,lab,list,val,opt){var cu=val&&list.indexOf(val)<0;
 return'<label>'+lab+'<select id="'+id+'">'+(opt?'<option value="">— нет —</option>':"")+list.map(function(x){return'<option'+(x==val?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'<option value="__"'+(cu?" selected":"")+'>Другое…</option></select><input id="'+id+'_t" placeholder="Впишите вручную" value="'+(cu?esc(val):"")+'"'+(cu?"":" hidden")+'></label>'}

function fillSubj(){var n=gv("fs"),c=CAT.filter(function(x){return x[0]==n})[0];if(!c)return;var rs=isR(c[1])?c[1].split("/"):[c[1]],t=c[2].split(", ");sv("fr1",rs[0]);sv("fr2",rs[1]||"");sv("ft1",t[0]);sv("ft2",t[1]||"");var u=$("fu");if(u)u.checked=/^хим/i.test(n)}

 if(!CL&&(a=="zam"||a=="vpr"))fillSubj()}
function j(a,b,s){return[a,b].filter(Boolean).join(s)}
function saveF(){var l=CL||{},o;
 if(CA=="zam"){var n=gv("fs");if(!n)return;o={t:"zam",n:n,r:j(gv("fr1"),gv("fr2"),"/"),p:j(gv("ft1"),gv("ft2"),", "),u:$("fu").checked}}
 else if(CA=="aud"){if(!gv("fr1"))return;o=Object.assign({},l,{t:"aud",r:j(gv("fr1"),gv("fr2"),"/")})}
 else if(CA=="prep"){if(!gv("ft1"))return;o=Object.assign({},l,{t:"prep",p:j(gv("ft1"),gv("ft2"),", ")})}
 else{if(!gv("fs"))return;o={t:"vpr",n:gv("fs"),r:gv("fr1"),p:"",u:false}}

$("dl").onclick=function(ev){var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
 if(a=="x")close();else if(a=="save")saveF();
 else if(a=="cancel"){st.ch[CK]={cancel:true};done()}
 else if(a=="undo"){delete st.ch[CK];done()}else form(a)};

tab(false);
</script></body></html>
